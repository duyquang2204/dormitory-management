<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 p-0">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4>Quản lý Đơn Đăng Ký Phòng</h4>
                </div>
                
                <div th:if="${param.success}" class="alert alert-success">
                    Xử lý đơn đăng ký thành công!
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Ngày Gửi</th>
                                    <th>Mã SV</th>
                                    <th>Họ Tên</th>
                                    <th>Loại phòng ĐK</th>
                                    <th>Ghi chú</th>
                                    <th>Trạng thái</th>
                                    <th>Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="dk : ${dangKyList}">
                                    <td th:text="${dk.ngayDangKy}"></td>
                                    <td th:text="${dk.sinhVien != null ? dk.sinhVien.maSV : ''}" class="fw-bold"></td>
                                    <td th:text="${dk.sinhVien != null ? dk.sinhVien.hoTen : ''}"></td>
                                    <td th:text="${dk.loaiPhong != null ? dk.loaiPhong.tenLoaiPhong : ''}"></td>
                                    <td th:text="${dk.ghiChu}"></td>
                                    <td>
                                        <span th:class="${dk.trangThai == 'Đã duyệt' ? 'badge bg-success' : (dk.trangThai == 'Từ chối' ? 'badge bg-danger' : 'badge bg-warning text-dark')}" 
                                              th:text="${dk.trangThai}"></span>
                                    </td>
                                    <td>
                                        <div th:if="${dk.trangThai == 'Chờ duyệt'}">
                                            <a th:href="@{/quansinh/dang-ky/duyet/{id}(id=${dk.maDangKy})}" class="btn btn-sm btn-success mb-1" title="Duyệt / Phân phòng"><i class="fas fa-check"></i> Duyệt</a>
                                            <form th:action="@{/quansinh/dang-ky/tu-choi/{id}(id=${dk.maDangKy})}" method="post" style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-danger mb-1" title="Từ chối" onclick="return confirm('Bạn có chắc muốn từ chối đơn này?');"><i class="fas fa-times"></i></button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(dangKyList)}">
                                    <td colspan="7" class="text-center text-muted py-3">Không có đơn đăng ký nào</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
