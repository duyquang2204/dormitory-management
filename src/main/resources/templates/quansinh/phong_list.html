<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 p-0">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4>Quản lý Phòng</h4>
                    <a th:href="@{/quansinh/phong/them}" class="btn btn-success"><i class="fas fa-plus me-1"></i>Thêm phòng</a>
                </div>
                
                <div th:if="${param.success}" class="alert alert-success">
                    Lưu thông tin phòng thành công!
                </div>

                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <form th:action="@{/quansinh/phong}" method="get" class="row g-3 align-items-center">
                            <div class="col-auto">
                                <label for="maKhu" class="col-form-label fw-bold">Chọn Khu:</label>
                            </div>
                            <div class="col-auto">
                                <select class="form-select" id="maKhu" name="maKhu" onchange="this.form.submit()">
                                    <option value="">-- Tất cả các khu --</option>
                                    <option th:each="khu : ${khus}" 
                                            th:value="${khu.maKhu}" 
                                            th:text="${khu.tenKhu}"
                                            th:selected="${khu.maKhu == maKhu}"></option>
                                </select>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Số phòng</th>
                                    <th>Khu</th>
                                    <th>Loại phòng</th>
                                    <th>Số người tối đa</th>
                                    <th>Đơn giá</th>
                                    <th>Trạng thái</th>
                                    <th>Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${phongPage.content}">
                                    <td th:text="${p.soPhong}" class="fw-bold"></td>
                                    <td th:text="${p.khu != null ? p.khu.tenKhu : ''}"></td>
                                    <td th:text="${p.loaiPhong != null ? p.loaiPhong.tenLoaiPhong : ''}"></td>
                                    <td th:text="${p.loaiPhong != null ? p.loaiPhong.soNguoiToiDa : ''}"></td>
                                    <td th:text="${p.loaiPhong != null ? #numbers.formatDecimal(p.loaiPhong.donGia, 0, 'COMMA', 0, 'POINT') + ' đ' : ''}"></td>
                                    <td>
                                        <span th:class="${p.trangThai == 'Trống' ? 'badge bg-success' : (p.trangThai == 'Đã đầy' ? 'badge bg-danger' : 'badge bg-warning')}" 
                                              th:text="${p.trangThai}"></span>
                                    </td>
                                    <td>
                                        <a th:href="@{/quansinh/phong/sua/{id}(id=${p.maPhong})}" class="btn btn-sm btn-outline-primary" title="Sửa"><i class="fas fa-edit"></i></a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(phongPage.content)}">
                                    <td colspan="7" class="text-center text-muted py-4">
                                        <i class="fas fa-info-circle mb-2" style="font-size: 24px;"></i><br/>
                                        <span th:if="${maKhu == null or maKhu == ''}">Vui lòng chọn Khu ở trên để xem danh sách phòng.</span>
                                        <span th:unless="${maKhu == null or maKhu == ''}">Không có phòng nào trong Khu này.</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        
                        <!-- Pagination Fragment -->
                        <div th:replace="~{fragments/pagination :: pagination(pageObj=${phongPage}, url='/quansinh/phong', queryParams=${maKhu != null ? '&maKhu=' + maKhu : ''})}"></div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
