<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 p-0">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 th:text="${sinhVienDTO.maSV != null and !sinhVienDTO.maSV.isEmpty() ? 'Cập nhật sinh viên' : 'Thêm sinh viên mới'}"></h4>
                    <a th:href="@{/quansinh/sinhvien}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i>Quay lại</a>
                </div>
                
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form th:action="@{/quansinh/sinhvien/luu}" th:object="${sinhVienDTO}" method="post">
                            <input type="hidden" name="isEdit" th:value="${isEdit}">
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label class="form-label">Mã sinh viên <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{maSV}" th:readonly="${isEdit}" th:classappend="${#fields.hasErrors('maSV')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('maSV')}" th:errors="*{maSV}"></div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Họ tên <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{hoTen}" th:classappend="${#fields.hasErrors('hoTen')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}"></div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Mật khẩu (Để trống nếu giữ nguyên)</label>
                                    <input type="password" class="form-control" th:field="*{matKhau}">
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label class="form-label">Giới tính</label>
                                    <select class="form-select" th:field="*{gioiTinh}">
                                        <option value="Nam">Nam</option>
                                        <option value="Nữ">Nữ</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Ngày sinh</label>
                                    <input type="date" class="form-control" th:field="*{ngaySinh}">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Số ĐTDĐ</label>
                                    <input type="text" class="form-control" th:field="*{sdt}">
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label class="form-label">Số CCCD <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{cccd}" th:classappend="${#fields.hasErrors('cccd')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('cccd')}" th:errors="*{cccd}"></div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" th:field="*{email}">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Quê quán</label>
                                    <input type="text" class="form-control" th:field="*{queQuan}">
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-4">
                                    <label class="form-label">Khoa</label>
                                    <input type="text" class="form-control" th:field="*{khoa}">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Năm học</label>
                                    <input type="number" class="form-control" th:field="*{namHoc}">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Diện ưu tiên</label>
                                    <input type="text" class="form-control" th:field="*{dienUuTien}" placeholder="Ví dụ: Hộ nghèo, Con thương binh...">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i>Lưu thông tin</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
