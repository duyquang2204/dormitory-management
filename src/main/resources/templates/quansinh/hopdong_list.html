<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 p-0">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4>Quản lý Hợp đồng Lưu trú</h4>
                    <a th:href="@{/quansinh/hop-dong/them}" class="btn btn-primary"><i class="fas fa-plus me-1"></i> Lập hợp đồng mới</a>
                </div>
                
                <div th:if="${param.success}" class="alert alert-success">
                    Thao tác thành công!
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Ngày Lập</th>
                                    <th>Mã SV</th>
                                    <th>Phòng</th>
                                    <th>Thời hạn</th>
                                    <th>Giá tiền</th>
                                    <th>Trạng thái</th>
                                    <th>Yêu cầu SV</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="hd : ${hopDongs}">
                                    <td th:text="${hd.ngayLap}"></td>
                                    <td th:text="${hd.phanPhong.sinhVien.maSV}" class="fw-bold"></td>
                                    <td th:text="${hd.phanPhong.phong.soPhong}"></td>
                                    <td>
                                        <span th:text="${#temporals.format(hd.ngayBatDau, 'dd/MM/yyyy') + ' - ' + #temporals.format(hd.ngayKetThuc, 'dd/MM/yyyy')}"></span>
                                        <br>
                                        <span th:if="${hd.isSapHetHan()}" class="badge bg-warning text-dark"><i class="fas fa-exclamation-triangle"></i> Sắp hết</span>
                                    </td>
                                    <td th:text="${#numbers.formatDecimal(hd.giaTien, 0, 'COMMA', 0, 'POINT')} + ' đ'" class="text-danger"></td>
                                    <td>
                                        <span th:class="${hd.trangThai == 'Đã hết hạn' or hd.trangThai == 'Đã thanh lý' ? 'badge bg-danger' : 'badge bg-success'}" 
                                              th:text="${hd.trangThai}"></span>
                                    </td>
                                    <td>
                                        <span th:if="${hd.yeuCauCuaSV != null}" class="badge bg-info text-dark" th:text="${hd.yeuCauCuaSV}"></span>
                                        <span th:unless="${hd.yeuCauCuaSV != null}" class="text-muted small">-</span>
                                    </td>
                                    <td>
                                        <!-- Actions -->
                                        <div class="d-flex gap-1" th:if="${hd.trangThai != 'Đã thanh lý'}">
                                            <!-- Nếu xin gia hạn -->
                                            <form th:if="${hd.yeuCauCuaSV == 'Xin gia hạn'}" th:action="@{/quansinh/hop-dong/duyet-gia-han}" method="post">
                                                <input type="hidden" name="maHopDong" th:value="${hd.maHopDong}">
                                                <input type="hidden" name="soThang" value="12">
                                                <button type="submit" class="btn btn-sm btn-success" title="Duyệt gia hạn 1 năm"><i class="fas fa-check"></i> Duyệt GH</button>
                                            </form>
                                            
                                            <!-- Báo trả phòng hoặc Đã hết hạn -->
                                            <form th:if="${hd.yeuCauCuaSV == 'Báo trả phòng' or hd.trangThai == 'Đã hết hạn'}" th:action="@{/quansinh/hop-dong/thanh-ly}" method="post">
                                                <input type="hidden" name="maHopDong" th:value="${hd.maHopDong}">
                                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Bạn xác nhận thanh lý hợp đồng và thu hồi giường này?');" title="Thanh lý hợp đồng"><i class="fas fa-times-circle"></i> Thanh lý</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(hopDongs)}">
                                    <td colspan="7" class="text-center text-muted py-3">Không có hợp đồng nào</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
