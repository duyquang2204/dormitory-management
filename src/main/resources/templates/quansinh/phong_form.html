<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 p-0">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 th:text="${phongDTO.maPhong != null ? 'Cập nhật phòng' : 'Thêm phòng mới'}"></h4>
                    <a th:href="@{/quansinh/phong}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i>Quay lại</a>
                </div>
                
                <div th:if="${#lists.isEmpty(khus) or #lists.isEmpty(loaiPhongs)}" class="alert alert-warning">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <strong>Chú ý:</strong> Chưa có dữ liệu Khu hoặc Loại phòng trong hệ thống. Vui lòng thêm Khu và Loại phòng trước khi tạo Phòng.
                    <div class="mt-2">
                        <a th:href="@{/quansinh/khu/them}" class="btn btn-sm btn-outline-warning me-2 text-dark border-dark">Thêm Khu</a>
                        <a th:href="@{/quansinh/loaiphong/them}" class="btn btn-sm btn-outline-warning text-dark border-dark">Thêm Loại phòng</a>
                    </div>
                </div>
                
                <div th:if="${param.successKhu}" class="alert alert-success">Đã thêm Khu thành công!</div>
                <div th:if="${param.successLoaiPhong}" class="alert alert-success">Đã thêm Loại phòng thành công!</div>

                <div class="card shadow-sm" style="max-width: 600px;">
                    <div class="card-body">
                        <form th:action="@{/quansinh/phong/luu}" th:object="${phongDTO}" method="post">
                            <input type="hidden" th:field="*{maPhong}" />
                            
                            <div class="mb-3">
                                <label class="form-label">Số phòng <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{soPhong}" th:classappend="${#fields.hasErrors('soPhong')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('soPhong')}" th:errors="*{soPhong}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Khu <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{maKhu}" th:classappend="${#fields.hasErrors('maKhu')} ? 'is-invalid' : ''">
                                    <option value="">-- Chọn khu --</option>
                                    <option th:each="k : ${khus}" th:value="${k.maKhu}" th:text="${k.tenKhu}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('maKhu')}" th:errors="*{maKhu}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Loại phòng <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{maLoaiPhong}" th:classappend="${#fields.hasErrors('maLoaiPhong')} ? 'is-invalid' : ''">
                                    <option value="">-- Chọn loại phòng --</option>
                                    <option th:each="lp : ${loaiPhongs}" th:value="${lp.maLoaiPhong}" th:text="${lp.tenLoaiPhong + ' (' + lp.soNguoiToiDa + ' người)'}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('maLoaiPhong')}" th:errors="*{maLoaiPhong}"></div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Trạng thái</label>
                                <select class="form-select" th:field="*{trangThai}">
                                    <option value="Trống">Trống</option>
                                    <option value="Đang ở">Đang ở</option>
                                    <option value="Đã đầy">Đã đầy</option>
                                    <option value="Bảo trì">Bảo trì</option>
                                </select>
                            </div>

                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-success" th:disabled="${#lists.isEmpty(khus) or #lists.isEmpty(loaiPhongs)}">
                                    <i class="fas fa-save me-1"></i>Lưu thông tin
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
