<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 p-0">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4>Quản lý Sinh viên</h4>
                    <a th:href="@{/quansinh/sinhvien/them}" class="btn btn-success"><i class="fas fa-plus me-1"></i>Thêm sinh viên</a>
                </div>
                
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <div th:if="${param.success}" class="alert alert-success">
                    Lưu thông tin sinh viên thành công!
                </div>

                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <form th:action="@{/quansinh/sinhvien}" method="get" class="row g-3 align-items-center">
                            <div class="col-auto">
                                <label for="keyword" class="col-form-label fw-bold">Tìm kiếm sinh viên:</label>
                            </div>
                            <div class="col-auto">
                                <input type="text" class="form-control" id="keyword" name="keyword" th:value="${keyword}" placeholder="Nhập tên hoặc mã SV (VD: SV0001)..." style="min-width: 280px;">
                            </div>
                            <div class="col-auto">
                                <button type="submit" class="btn btn-primary"><i class="fas fa-search me-1"></i>Tìm kiếm</button>
                                <a th:href="@{/quansinh/sinhvien}" class="btn btn-outline-secondary">Xóa tìm kiếm</a>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle" style="min-width: 900px;">
                                <thead>
                                    <tr>
                                        <th>Mã SV</th>
                                        <th>Họ tên</th>
                                        <th>Trạng thái</th>
                                        <th>Giới tính</th>
                                        <th>Khoa</th>
                                        <th>Năm vào KTX</th>
                                        <th>SĐT</th>
                                        <th>Email</th>
                                        <th class="text-center text-nowrap" style="min-width: 160px;">Hành động</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="sv : ${sinhVienPage.content}">
                                        <td th:text="${sv.maSV}"></td>
                                        <td class="fw-bold" th:text="${sv.hoTen}"></td>
                                        <td>
                                            <span th:if="${trangThaiMap.get(sv.maSV) == 'Đã khóa tài khoản'}" class="badge bg-danger text-white">
                                                <i class="fas fa-user-slash me-1"></i>Đã khóa tài khoản
                                            </span>
                                            <span th:if="${trangThaiMap.get(sv.maSV) != null and #strings.startsWith(trangThaiMap.get(sv.maSV), 'Nội trú')}" class="badge bg-success text-white">
                                                <i class="fas fa-check-circle me-1"></i><span th:text="${trangThaiMap.get(sv.maSV)}"></span>
                                            </span>
                                            <span th:if="${trangThaiMap.get(sv.maSV) == 'Đã rời KTX (Ngoại trú)'}" class="badge bg-secondary text-white">
                                                <i class="fas fa-walking me-1"></i>Đã rời KTX (Ngoại trú)
                                            </span>
                                            <span th:if="${trangThaiMap.get(sv.maSV) == 'Chờ xếp phòng'}" class="badge bg-info text-dark">
                                                <i class="fas fa-clock me-1"></i>Chờ xếp phòng
                                            </span>
                                        </td>
                                        <td th:text="${sv.gioiTinh}"></td>
                                        <td th:text="${sv.khoa}"></td>
                                        <td th:text="${sv.namHoc}"></td>
                                        <td th:text="${sv.sdt}"></td>
                                        <td th:text="${sv.email}"></td>
                                        <td class="text-nowrap">
                                            <div class="d-flex gap-1 justify-content-center">
                                                <!-- Xếp phòng nhanh (chỉ hiện khi chưa có phòng hoặc đã rời KTX) -->
                                                <a th:if="${trangThaiMap.get(sv.maSV) == 'Chờ xếp phòng' or trangThaiMap.get(sv.maSV) == 'Đã rời KTX (Ngoại trú)'}" 
                                                   th:href="@{/quansinh/phong/phan-nhanh/{id}(id=${sv.maSV})}" 
                                                   class="btn btn-sm btn-outline-success" title="Xếp phòng cho sinh viên">
                                                    <i class="fas fa-bed"></i>
                                                </a>
                                                
                                                <a th:href="@{/quansinh/sinhvien/sua/{id}(id=${sv.maSV})}" class="btn btn-sm btn-outline-primary" title="Sửa thông tin"><i class="fas fa-edit"></i></a>
                                                
                                                <!-- Khóa / Mở khóa tài khoản -->
                                                <form th:action="@{/quansinh/sinhvien/khoa/{id}(id=${sv.maSV})}" method="post" class="d-inline">
                                                    <button th:if="${sv.trangThai == 'Đã khóa' or sv.trangThai == 'Bị khóa'}" 
                                                            type="submit" class="btn btn-sm btn-warning" 
                                                            onclick="return confirm('Bạn xác nhận muốn MỞ KHÓA tài khoản cho sinh viên này?');" 
                                                            title="Mở khóa tài khoản">
                                                        <i class="fas fa-unlock"></i>
                                                    </button>
                                                    <button th:unless="${sv.trangThai == 'Đã khóa' or sv.trangThai == 'Bị khóa'}" 
                                                            type="submit" class="btn btn-sm btn-outline-secondary" 
                                                            onclick="return confirm('Bạn xác nhận muốn KHÓA tài khoản sinh viên này (chặn đăng nhập vào KTX)?');" 
                                                            title="Khóa tài khoản (kỷ luật / rời KTX)">
                                                        <i class="fas fa-lock"></i>
                                                    </button>
                                                </form>

                                                <form th:action="@{/quansinh/sinhvien/xoa/{id}(id=${sv.maSV})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa sinh viên này không? Hệ thống sẽ xóa sạch dữ liệu liên quan và gửi email thông báo tới sinh viên.');">
                                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa vĩnh viễn"><i class="fas fa-trash"></i></button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(sinhVienPage.content)}">
                                        <td colspan="9" class="text-center text-muted py-3">Không tìm thấy sinh viên nào</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- Pagination Fragment -->
                        <div th:replace="~{fragments/pagination :: pagination(pageObj=${sinhVienPage}, url='/quansinh/sinhvien', queryParams=${keyword != null ? '&keyword=' + keyword : ''})}"></div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
