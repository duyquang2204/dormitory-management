<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 p-0">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Lập Biên Bản Vi Phạm</h4>
                    <a th:href="@{/quansinh/vi-pham}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-2"></i>Quay lại</a>
                </div>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="card shadow-sm" style="max-width: 600px; margin: 0 auto;">
                    <div class="card-body p-4">
                        <form th:action="@{/quansinh/vi-pham/luu}" th:object="${viPhamDTO}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Mã Sinh Viên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{maSV}" placeholder="Nhập mã sinh viên vi phạm" th:classappend="${#fields.hasErrors('maSV')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('maSV')}" th:errors="*{maSV}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Ngày Vi Phạm <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" th:field="*{ngayViPham}" th:classappend="${#fields.hasErrors('ngayViPham')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('ngayViPham')}" th:errors="*{ngayViPham}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Địa Điểm <span class="text-muted">(Không bắt buộc)</span></label>
                                <input type="text" class="form-control" th:field="*{diaDiem}" placeholder="Ví dụ: Phòng A101, Hành lang khu B...">
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Nội Dung Vi Phạm <span class="text-danger">*</span></label>
                                <textarea class="form-control" th:field="*{noiDung}" rows="4" placeholder="Mô tả chi tiết lỗi vi phạm..." th:classappend="${#fields.hasErrors('noiDung')} ? 'is-invalid' : ''"></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('noiDung')}" th:errors="*{noiDung}"></div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-danger btn-lg"><i class="fas fa-save me-2"></i>Lưu Biên Bản</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
