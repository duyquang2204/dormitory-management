<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet" />
    
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 p-0">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4>Lập Hợp đồng Lưu trú</h4>
                    <a th:href="@{/quansinh/hop-dong}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i> Quay lại</a>
                </div>

                <div class="card shadow-sm col-md-8 mx-auto">
                    <div class="card-body p-4">
                        <form th:action="@{/quansinh/hop-dong/luu}" th:object="${hopDongDTO}" method="post">
                            
                            <div class="mb-3">
                                <label class="form-label">Chọn hồ sơ Phân phòng (Đang ở) <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{maPhanPhong}" id="maPhanPhongSelect" required>
                                    <option value="">-- Chọn sinh viên - phòng --</option>
                                    <option th:each="pp : ${phanPhongs}" th:value="${pp.maPhanPhong}" th:text="${pp.sinhVien.maSV + ' - ' + pp.sinhVien.hoTen + ' (Phòng ' + pp.phong.soPhong + ')'}"></option>
                                </select>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('maPhanPhong')}" th:errors="*{maPhanPhong}"></div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Ngày bắt đầu hợp đồng <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" th:field="*{ngayBatDau}" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('ngayBatDau')}" th:errors="*{ngayBatDau}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Ngày kết thúc <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" th:field="*{ngayKetThuc}" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('ngayKetThuc')}" th:errors="*{ngayKetThuc}"></div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Tiền thuê phòng/tháng (VNĐ) <span class="text-danger">*</span></label>
                                <input type="number" step="1000" class="form-control" th:field="*{giaTien}" placeholder="Ví dụ: 3000000" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('giaTien')}" th:errors="*{giaTien}"></div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Lưu Hợp Đồng</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#maPhanPhongSelect').select2({
                theme: 'bootstrap-5',
                placeholder: "-- Chọn sinh viên - phòng --",
                allowClear: true
            });
        });
    </script>
</body>
</html>
