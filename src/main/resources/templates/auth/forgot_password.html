<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - Ký Túc Xá</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
    <div class="card shadow-lg p-4 p-md-5 border-0" style="max-width: 440px; width: 100%; border-radius: 16px;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 64px; height: 64px;">
                <i class="fa-solid fa-key fa-2x"></i>
            </div>
            <h4 class="fw-bold mb-1">QUÊN MẬT KHẨU</h4>
            <p class="text-muted small">Nhập Email hoặc Mã sinh viên để nhận mã OTP xác thực</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert" th:text="${errorMessage}"></div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="mb-3">
                <label for="account" class="form-label fw-semibold small">Mã SV hoặc Email đăng ký</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-envelope"></i></span>
                    <input type="text" class="form-control" id="account" name="account" 
                           th:value="${account}" placeholder="Nhập Email hoặc Mã SV..." required autofocus>
                </div>
            </div>

            <div class="alert alert-info py-2 small mb-4">
                <i class="fa-solid fa-circle-info me-1"></i> Hệ thống sẽ gửi mã OTP xác nhận gồm 6 chữ số đến địa chỉ email đã đăng ký của bạn.
            </div>

            <div class="d-grid gap-2 mb-3">
                <button type="submit" class="btn btn-primary py-2 fw-semibold shadow-sm text-white">
                    <i class="fa-solid fa-paper-plane me-2"></i>Gửi mã OTP xác thực
                </button>
            </div>
        </form>

        <div class="text-center pt-3 border-top">
            <a th:href="@{/login}" class="text-decoration-none small text-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i>Quay lại trang Đăng nhập
            </a>
        </div>
    </div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
