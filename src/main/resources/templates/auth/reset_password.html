<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Ký Túc Xá</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
    <div class="card shadow-lg p-4 p-md-5 border-0" style="max-width: 460px; width: 100%; border-radius: 16px;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 64px; height: 64px;">
                <i class="fa-solid fa-lock-open fa-2x"></i>
            </div>
            <h4 class="fw-bold mb-1">ĐẶT LẠI MẬT KHẨU</h4>
            <p class="text-muted small">Nhập mã OTP đã nhận qua Email và mật khẩu mới</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success py-2 small" role="alert" th:text="${successMessage}"></div>

        <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
            <input type="hidden" th:field="*{email}">

            <div class="mb-3">
                <label class="form-label fw-semibold small text-muted">Email xác thực</label>
                <input type="text" class="form-control bg-light" th:value="*{email}" readonly>
            </div>

            <div class="mb-3">
                <label for="otpCode" class="form-label fw-semibold small">Mã OTP (6 chữ số) <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-shield-halved"></i></span>
                    <input type="text" class="form-control text-center fw-bold letter-spacing-2" 
                           id="otpCode" th:field="*{otpCode}" maxlength="6" pattern="[0-9]{6}" placeholder="Nhập 6 số OTP" required autofocus>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('otpCode')}" th:errors="*{otpCode}"></div>
            </div>

            <div class="mb-3">
                <label for="matKhauMoi" class="form-label fw-semibold small">Mật khẩu mới <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="matKhauMoi" th:field="*{matKhauMoi}" placeholder="Tối thiểu 6 ký tự" required>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('matKhauMoi')}" th:errors="*{matKhauMoi}"></div>
            </div>

            <div class="mb-4">
                <label for="xacNhanMatKhau" class="form-label fw-semibold small">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-check-double"></i></span>
                    <input type="password" class="form-control" id="xacNhanMatKhau" th:field="*{xacNhanMatKhau}" placeholder="Nhập lại mật khẩu mới" required>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('xacNhanMatKhau')}" th:errors="*{xacNhanMatKhau}"></div>
            </div>

            <div class="d-grid gap-2 mb-3">
                <button type="submit" class="btn btn-primary py-2 fw-semibold shadow-sm">
                    <i class="fa-solid fa-key me-2"></i>Cập nhật mật khẩu mới
                </button>
            </div>
        </form>

        <div class="text-center pt-2">
            <p class="small text-muted mb-1">Chưa nhận được mã?</p>
            <a th:href="@{/resend-otp(email=*{email}, type='QUEN_MAT_KHAU')}" class="text-decoration-none small text-primary fw-semibold">
                <i class="fa-solid fa-rotate-right me-1"></i>Gửi lại mã OTP
            </a>
        </div>

        <div class="text-center mt-3 pt-3 border-top">
            <a th:href="@{/login}" class="text-decoration-none small text-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i>Quay lại trang Đăng nhập
            </a>
        </div>
    </div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
