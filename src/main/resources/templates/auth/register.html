<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Ký Túc Xá Tư Nhân</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
    <div class="card shadow-lg p-4 p-md-5 border-0" style="max-width: 520px; width: 100%; border-radius: 16px;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 64px; height: 64px;">
                <i class="fa-solid fa-user-plus fa-2x"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">ĐĂNG KÝ TÀI KHOẢN</h3>
            <p class="text-muted small">Dành cho sinh viên các trường Đại học & Cao đẳng</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" th:object="${registerDTO}" method="post">
            <div class="mb-3">
                <label for="hoTen" class="form-label fw-semibold small">Họ và tên sinh viên <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-id-card"></i></span>
                    <input type="text" class="form-control" id="hoTen" th:field="*{hoTen}" placeholder="Ví dụ: Nguyễn Văn An" required>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}"></div>
            </div>

            <div class="mb-3">
                <label for="truongDaiHoc" class="form-label fw-semibold small">Trường Đại học / Cao đẳng đang học <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-graduation-cap"></i></span>
                    <input type="text" class="form-control" id="truongDaiHoc" th:field="*{truongDaiHoc}" placeholder="Ví dụ: ĐH Sư Phạm Kỹ Thuật, ĐH Bách Khoa..." required>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('truongDaiHoc')}" th:errors="*{truongDaiHoc}"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label fw-semibold small">Email nhận mã OTP <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="email@gmail.com" required>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="sdt" class="form-label fw-semibold small">Số điện thoại <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-phone"></i></span>
                        <input type="tel" class="form-control" id="sdt" th:field="*{sdt}" placeholder="0901234567" required>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('sdt')}" th:errors="*{sdt}"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="matKhau" class="form-label fw-semibold small">Mật khẩu <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" id="matKhau" th:field="*{matKhau}" placeholder="Tối thiểu 6 ký tự" required>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('matKhau')}" th:errors="*{matKhau}"></div>
                </div>

                <div class="col-md-6 mb-4">
                    <label for="xacNhanMatKhau" class="form-label fw-semibold small">Nhập lại mật khẩu <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-shield-halved"></i></span>
                        <input type="password" class="form-control" id="xacNhanMatKhau" th:field="*{xacNhanMatKhau}" placeholder="Xác nhận lại" required>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('xacNhanMatKhau')}" th:errors="*{xacNhanMatKhau}"></div>
                </div>
            </div>

            <div class="alert alert-info py-2 small mb-4">
                <i class="fa-solid fa-info-circle me-1"></i> Sau khi nhấn Đăng ký, hệ thống sẽ gửi <strong>mã OTP gồm 6 chữ số</strong> đến email của bạn để kích hoạt tài khoản.
            </div>

            <div class="d-grid gap-2 mb-3">
                <button type="submit" class="btn btn-primary py-2 fw-semibold shadow-sm">
                    <i class="fa-solid fa-paper-plane me-2"></i>Tiếp tục & Nhận mã OTP
                </button>
            </div>
        </form>

        <div class="text-center pt-3 border-top">
            <p class="small text-muted mb-0">Đã có tài khoản? <a th:href="@{/login}" class="text-primary fw-semibold text-decoration-none">Đăng nhập ngay</a></p>
        </div>
    </div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
