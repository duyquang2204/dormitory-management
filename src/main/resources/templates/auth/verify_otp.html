<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực mã OTP - Ký Túc Xá</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
    <div class="card shadow-lg p-4 p-md-5 border-0 text-center" style="max-width: 440px; width: 100%; border-radius: 16px;">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3 mx-auto" style="width: 64px; height: 64px;">
            <i class="fa-solid fa-envelope-circle-check fa-2x"></i>
        </div>
        <h4 class="fw-bold mb-1">XÁC THỰC MÃ OTP</h4>
        <p class="text-muted small mb-3">Mã kích hoạt gồm 6 chữ số đã được gửi đến email:</p>
        <p class="fw-bold text-primary mb-3 bg-light py-2 rounded border" th:text="${email}"></p>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small text-start" role="alert" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success py-2 small text-start" role="alert" th:text="${successMessage}"></div>

        <form th:action="@{/verify-otp}" method="post">
            <input type="hidden" name="email" th:value="${email}">
            
            <div class="mb-4">
                <label for="otpCode" class="form-label fw-semibold small text-muted">Nhập 6 số mã OTP</label>
                <input type="text" class="form-control form-control-lg text-center fw-bold fs-3 letter-spacing-4" 
                       id="otpCode" name="otpCode" maxlength="6" pattern="[0-9]{6}" placeholder="------" required autofocus>
                <div class="form-text small text-danger mt-2">
                    <i class="fa-regular fa-clock me-1"></i> Mã OTP có hiệu lực trong 5 phút
                </div>
            </div>

            <div class="d-grid gap-2 mb-3">
                <button type="submit" class="btn btn-primary py-2 fw-semibold shadow-sm">
                    <i class="fa-solid fa-check me-2"></i>Kích hoạt tài khoản
                </button>
            </div>
        </form>

        <div class="text-center pt-2">
            <p class="small text-muted mb-1">Chưa nhận được mã?</p>
            <a th:href="@{/resend-otp(email=${email}, type='DANG_KY')}" class="text-decoration-none small text-primary fw-semibold">
                <i class="fa-solid fa-rotate-right me-1"></i>Gửi lại mã OTP
            </a>
        </div>

        <div class="text-center mt-3 pt-3 border-top">
            <a th:href="@{/login}" class="text-decoration-none small text-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i>Quay lại trang Đăng nhập
            </a>
        </div>
    </div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
