<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 p-0">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 th:text="${nguoiDungDTO.maNguoiDung != null ? 'Cập nhật tài khoản' : 'Thêm tài khoản mới'}"></h4>
                    <a th:href="@{/admin/tai-khoan}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i>Quay lại</a>
                </div>
                
                <div class="card shadow-sm" style="max-width: 800px;">
                    <div class="card-body">
                        <form th:action="@{/admin/tai-khoan/luu}" th:object="${nguoiDungDTO}" method="post">
                            <input type="hidden" th:field="*{maNguoiDung}" />
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Tên đăng nhập <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{tenDangNhap}" th:classappend="${#fields.hasErrors('tenDangNhap')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('tenDangNhap')}" th:errors="*{tenDangNhap}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Mật khẩu <span th:if="*{maNguoiDung == null}" class="text-danger">*</span></label>
                                    <input type="password" class="form-control" th:field="*{matKhau}" placeholder="Để trống nếu không muốn đổi mật khẩu">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Họ tên <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{hoTen}" th:classappend="${#fields.hasErrors('hoTen')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Số điện thoại</label>
                                    <input type="text" class="form-control" th:field="*{sdt}" th:classappend="${#fields.hasErrors('sdt')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('sdt')}" th:errors="*{sdt}"></div>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Chức vụ <span class="text-danger">*</span></label>
                                    <select class="form-select" th:field="*{chucVu}">
                                        <option value="Quản sinh">Quản sinh</option>
                                        <option value="Nhân viên sửa chữa">Nhân viên sửa chữa</option>
                                        <option value="Quản trị viên">Quản trị viên</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Trạng thái</label>
                                    <select class="form-select" th:field="*{trangThai}">
                                        <option value="Hoạt động">Hoạt động</option>
                                        <option value="Bị khóa">Bị khóa</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i>Lưu thông tin</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
