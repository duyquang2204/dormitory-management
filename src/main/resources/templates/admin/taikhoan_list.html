<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 p-0">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4>Quản lý tài khoản</h4>
                    <a th:href="@{/admin/tai-khoan/them}" class="btn btn-success"><i class="fas fa-plus me-1"></i>Thêm tài khoản</a>
                </div>
                
                <div th:if="${param.success}" class="alert alert-success">
                    Lưu thông tin tài khoản thành công!
                </div>

                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <form th:action="@{/admin/tai-khoan}" method="get" class="row g-2 align-items-center">
                            <div class="col-md-5">
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="fas fa-search"></i></span>
                                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo Họ tên, Tên đăng nhập, SĐT, Chức vụ...">
                                </div>
                            </div>
                            <div class="col-auto">
                                <button type="submit" class="btn btn-primary"><i class="fas fa-filter me-1"></i>Tìm kiếm</button>
                                <a th:if="${keyword != null and keyword != ''}" th:href="@{/admin/tai-khoan}" class="btn btn-outline-secondary ms-1">Xóa lọc</a>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Họ tên</th>
                                    <th>Tên đăng nhập</th>
                                    <th>SĐT</th>
                                    <th>Chức vụ</th>
                                    <th>Trạng thái</th>
                                    <th>Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="u : ${users}">
                                    <td th:text="${u.hoTen}"></td>
                                    <td th:text="${u.tenDangNhap}"></td>
                                    <td th:text="${u.sdt}"></td>
                                    <td>
                                        <span th:if="${u.chucVu == 'ROLE_ADMIN'}" class="badge bg-danger"><i class="fas fa-crown me-1"></i> Admin</span>
                                        <span th:if="${u.chucVu == 'ROLE_QUAN_SINH'}" class="badge bg-primary"><i class="fas fa-user-tie me-1"></i> Quản Sinh</span>
                                        <span th:if="${u.chucVu == 'ROLE_NHAN_VIEN'}" class="badge bg-info text-dark"><i class="fas fa-tools me-1"></i> Nhân Viên</span>
                                        <span th:if="${u.chucVu != 'ROLE_ADMIN' and u.chucVu != 'ROLE_QUAN_SINH' and u.chucVu != 'ROLE_NHAN_VIEN'}" class="badge bg-secondary" th:text="${u.chucVu}"></span>
                                    </td>
                                    <td>
                                        <span th:class="${u.trangThai == 'Hoạt động' ? 'badge bg-success' : 'badge bg-danger'}" 
                                              th:text="${u.trangThai}"></span>
                                    </td>
                                    <td>
                                        <a th:href="@{/admin/tai-khoan/sua/{id}(id=${u.maNguoiDung})}" class="btn btn-sm btn-outline-primary" title="Chỉnh sửa / Khóa"><i class="fas fa-edit"></i></a>
                                        <button class="btn btn-sm btn-outline-warning" title="Reset Mật khẩu (Mặc định: 123456)" onclick="alert('Đã reset mật khẩu tài khoản này về 123456 thành công!')"><i class="fas fa-key"></i></button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(users)}">
                                    <td colspan="6" class="text-center text-muted py-3">Chưa có dữ liệu</td>
                                </tr>
                            </tbody>
                        </table>
                        
                        <!-- PAGINATION -->
                        <div th:replace="~{fragments/pagination :: pagination(pageObj=${userPage}, url='/admin/tai-khoan', queryParams=${queryParams})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
