<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 p-0">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-10 p-4">
                <h4 class="mb-4">Hồ sơ Vi phạm / Kỷ luật</h4>
                
                <div class="card shadow-sm border-danger border-top border-4">
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(viPhamList)}" class="text-center py-5">
                            <i class="fas fa-medal text-success fa-4x mb-3"></i>
                            <h5 class="text-success">Rất tốt!</h5>
                            <p class="text-muted">Bạn không có bất kỳ vi phạm kỷ luật nào.</p>
                        </div>
                        
                        <div th:if="${not #lists.isEmpty(viPhamList)}">
                            <div class="alert alert-warning">
                                <i class="fas fa-exclamation-triangle"></i> Bạn có <strong th:text="${#lists.size(viPhamList)}"></strong> hồ sơ vi phạm cần lưu ý.
                            </div>
                            
                            <div class="table-responsive">
                                <table class="table table-hover align-middle border">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Ngày lập BB</th>
                                            <th>Ngày vi phạm</th>
                                            <th>Nội dung</th>
                                            <th>Địa điểm</th>
                                            <th>Hình thức xử lý</th>
                                            <th>Trạng thái</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="vp : ${viPhamList}">
                                            <td th:text="${#temporals.format(vp.ngayLapBienBan, 'dd/MM/yyyy')}"></td>
                                            <td th:text="${#temporals.format(vp.ngayViPham, 'dd/MM/yyyy')}"></td>
                                            <td><strong th:text="${vp.noiDung}"></strong></td>
                                            <td th:text="${vp.diaDiem}"></td>
                                            <td th:text="${vp.hinhThucXuLy}"></td>
                                            <td>
                                                <span th:class="${vp.trangThaiXuLy == 'Đã xử lý' ? 'badge bg-success' : 'badge bg-danger'}" 
                                                      th:text="${vp.trangThaiXuLy}"></span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            
                            <!-- PAGINATION -->
                            <div th:replace="~{fragments/pagination :: pagination(pageObj=${viPhamPage}, url='/sinhvien/vi-pham', queryParams='')}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
