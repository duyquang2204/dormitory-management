<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="chat_widget">

    <!-- ========================================== -->
    <!-- 1. CHAT WIDGET DÀNH CHO SINH VIÊN          -->
    <!-- ========================================== -->
    <th:block sec:authorize="hasRole('SINH_VIEN')">
        <!-- Nút Chat nổi của Sinh viên -->
        <div id="studentChatFloatingBtn" class="position-fixed" style="bottom: 24px; right: 24px; z-index: 1045;">
            <button type="button" class="btn btn-primary rounded-pill shadow-lg d-flex align-items-center justify-content-center position-relative px-3 py-2 text-white fw-semibold"
                    style="height: 50px; font-size: 0.95rem; background: linear-gradient(135deg, #0d6efd, #0a58ca); border: none; box-shadow: 0 4px 15px rgba(13,110,253,0.35); transition: all 0.3s ease;"
                    id="toggleChatBtn" onclick="toggleStudentChatBox()" title="Nhắn tin với Ban Quản Lý KTX">
                <i class="fas fa-comments fs-5 me-2"></i>
                <span class="d-none d-sm-inline">Chat với BQL</span>
                <span id="studentChatBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none badge-chat-pulse" 
                      style="font-size: 0.75rem; border: 2px solid #ffffff; z-index: 10;">
                    <span id="studentChatBadgeCount">0</span>
                </span>
            </button>
        </div>

        <!-- Cửa sổ Chat Popup của Sinh viên -->
        <div id="studentChatWindow" class="position-fixed card shadow-lg border-0 d-none flex-column"
             style="bottom: 84px; right: 24px; width: 370px; max-width: calc(100vw - 32px); height: 490px; max-height: calc(100vh - 110px); z-index: 1045; border-radius: 14px; overflow: hidden;">
            
            <!-- Header -->
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-2 px-3">
                <div class="d-flex align-items-center">
                    <div class="rounded-circle bg-white text-primary d-flex align-items-center justify-content-center me-2 fw-bold" style="width: 32px; height: 32px; font-size: 0.9rem;">
                        <i class="fas fa-headset"></i>
                    </div>
                    <div>
                        <h6 class="mb-0 fw-bold" style="font-size: 0.95rem;">Ban Quản Sinh KTX</h6>
                        <small class="text-white-50" style="font-size: 0.72rem;"><i class="fas fa-circle text-success me-1" style="font-size: 0.55rem;"></i>Trực tuyến hỗ trợ</small>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" style="font-size: 0.75rem;" onclick="toggleStudentChatBox()" aria-label="Đóng"></button>
            </div>

            <!-- Message Log -->
            <div id="studentChatMessageLog" class="card-body p-3 overflow-auto d-flex flex-column gap-2" style="background-color: #f8f9fa;">
                <div class="text-center text-muted my-auto small" id="chatLoadingPlaceholder">
                    <div class="spinner-border spinner-border-sm text-primary mb-1"></div>
                    <div>Đang kết nối hỗ trợ...</div>
                </div>
            </div>

            <!-- Input area -->
            <div class="card-footer bg-white border-top p-2">
                <form id="studentChatForm" class="d-flex gap-2 m-0" onsubmit="event.preventDefault(); sendStudentMessage();">
                    <input type="text" id="studentMessageInput" class="form-control form-control-sm" placeholder="Nhập tin nhắn..." autocomplete="off">
                    <button type="submit" class="btn btn-primary btn-sm px-3 fw-bold">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>

        <script th:inline="javascript">
        /*<![CDATA[*/
        (function() {
            const studentMaSV = /*[[${#authentication != null ? #authentication.name : ''}]]*/ '';
            const studentHoTen = /*[[${#authentication != null and #authentication.principal instanceof T(vn.iotstar.dormitory.security.CustomUserDetails) ? #authentication.principal.hoTen : 'Sinh viên'}]]*/ 'Sinh viên';
            let isChatOpen = false;
            let isHistoryLoaded = false;
            let chatStompClient = null;

            document.addEventListener("DOMContentLoaded", function () {
                if (!studentMaSV || studentMaSV === 'anonymousUser') return;

                // 1. Kiểm tra số tin nhắn chưa đọc khi tải trang để hiển thị badge đỏ
                checkStudentUnreadMessages();

                // 2. Mở tự động nếu có query param ?openChat=true
                if (window.location.search && window.location.search.indexOf('openChat=true') !== -1) {
                    setTimeout(function() {
                        if (!isChatOpen) toggleStudentChatBox();
                    }, 400);
                }

                // 3. Kết nối WebSocket STOMP
                if (typeof SockJS !== 'undefined' && typeof Stomp !== 'undefined') {
                    const socket = new SockJS('/ws-dormitory');
                    chatStompClient = Stomp.over(socket);
                    chatStompClient.debug = null;

                    chatStompClient.connect({}, function () {
                        chatStompClient.subscribe('/topic/chat/' + studentMaSV, function (message) {
                            const msg = JSON.parse(message.body);
                            if (msg.vaiTroGui === 'QUAN_SINH') {
                                onManagerMessageReceived(msg);
                            }
                        });
                    });
                }
            });

            function checkStudentUnreadMessages() {
                fetch('/api/chat/unread-count?vaiTro=SINH_VIEN&maSV=' + studentMaSV)
                    .then(res => res.json())
                    .then(count => {
                        updateStudentBadges(count);
                    })
                    .catch(() => {});
            }

            function updateStudentBadges(count) {
                const badge = document.getElementById('studentChatBadge');
                const badgeCount = document.getElementById('studentChatBadgeCount');
                const toggleBtn = document.getElementById('toggleChatBtn');
                const sidebarBadge = document.getElementById('studentSidebarChatBadge');

                const countNum = parseInt(count) || 0;
                if (countNum > 0) {
                    const displayCount = countNum > 99 ? '99+' : countNum;
                    if (badge && badgeCount) {
                        badgeCount.innerText = displayCount;
                        badge.classList.remove('d-none');
                    }
                    if (toggleBtn) toggleBtn.classList.add('chat-btn-has-unread');
                    if (sidebarBadge) {
                        sidebarBadge.innerText = displayCount;
                        sidebarBadge.classList.remove('d-none');
                    }
                } else {
                    if (badge) badge.classList.add('d-none');
                    if (toggleBtn) toggleBtn.classList.remove('chat-btn-has-unread');
                    if (sidebarBadge) sidebarBadge.classList.add('d-none');
                }
            }

            window.toggleStudentChatBox = function() {
                const chatBox = document.getElementById('studentChatWindow');
                if (!chatBox) return;

                isChatOpen = !isChatOpen;
                if (isChatOpen) {
                    chatBox.classList.remove('d-none');
                    chatBox.classList.add('d-flex');
                    
                    // Ẩn badge đỏ & xóa hiệu ứng rung
                    updateStudentBadges(0);

                    // Tải lịch sử tin nhắn
                    if (!isHistoryLoaded) {
                        loadStudentChatHistory();
                    } else {
                        scrollStudentLogToBottom();
                    }

                    // Đánh dấu đã đọc trên server
                    fetch('/api/chat/read?maSV=' + studentMaSV + '&vaiTro=SINH_VIEN', { method: 'POST' });
                    
                    setTimeout(() => {
                        const input = document.getElementById('studentMessageInput');
                        if (input) input.focus();
                    }, 100);
                } else {
                    chatBox.classList.remove('d-flex');
                    chatBox.classList.add('d-none');
                }
            };

            function onManagerMessageReceived(msg) {
                appendStudentMessageBubble(msg);

                if (!isChatOpen) {
                    // Tăng số tin nhắn chưa đọc và hiển thị badge đỏ
                    const countEl = document.getElementById('studentChatBadgeCount');
                    let current = parseInt(countEl ? countEl.innerText : '0') || 0;
                    updateStudentBadges(current + 1);
                } else {
                    // Đang mở cửa sổ thì đánh dấu đã đọc ngay
                    fetch('/api/chat/read?maSV=' + studentMaSV + '&vaiTro=SINH_VIEN', { method: 'POST' });
                }
            }

            function loadStudentChatHistory() {
                const log = document.getElementById('studentChatMessageLog');
                fetch('/api/chat/history?maSV=' + studentMaSV)
                    .then(res => res.json())
                    .then(data => {
                        isHistoryLoaded = true;
                        log.innerHTML = '';
                        if (data.length === 0) {
                            log.innerHTML = `
                                <div class="text-center text-muted my-auto small p-3">
                                    <i class="fas fa-hand-sparkles text-primary fa-2x mb-2"></i>
                                    <div class="fw-bold text-dark">Xin chào ${studentHoTen}!</div>
                                    <div class="mt-1">Bạn có câu hỏi hoặc cần hỗ trợ về phòng ở, hóa đơn hay thủ tục? Hãy nhắn tin trực tiếp cho Ban Quản Sinh tại đây nhé.</div>
                                </div>
                            `;
                            return;
                        }
                        data.forEach(appendStudentMessageBubble);
                        scrollStudentLogToBottom();
                    })
                    .catch(() => {
                        log.innerHTML = '<div class="text-center text-danger my-auto small">Không thể tải lịch sử trò chuyện</div>';
                    });
            }

            function appendStudentMessageBubble(msg) {
                const log = document.getElementById('studentChatMessageLog');
                const placeholder = document.getElementById('chatLoadingPlaceholder');
                if (placeholder) placeholder.remove();

                const isMe = msg.vaiTroGui === 'SINH_VIEN';

                const bubbleHtml = `
                    <div class="d-flex flex-column ${isMe ? 'align-items-end' : 'align-items-start'} mb-1">
                        <div class="d-flex align-items-center mb-1">
                            <span class="small text-secondary me-1" style="font-size: 0.68rem;">${isMe ? 'Bạn' : 'Ban Quản Sinh'}</span>
                            <span class="text-muted" style="font-size: 0.65rem;">${msg.thoiGianFormatted || ''}</span>
                        </div>
                        <div class="p-2 px-3 rounded-3 shadow-sm ${isMe ? 'bg-primary text-white' : 'bg-white text-dark border'}" style="max-width: 82%; font-size: 0.88rem; word-break: break-word;">
                            ${escapeHtml(msg.noiDung)}
                        </div>
                    </div>
                `;

                log.insertAdjacentHTML('beforeend', bubbleHtml);
                scrollStudentLogToBottom();
            }

            function scrollStudentLogToBottom() {
                const log = document.getElementById('studentChatMessageLog');
                if (log) log.scrollTop = log.scrollHeight;
            }

            window.sendStudentMessage = function() {
                const input = document.getElementById('studentMessageInput');
                const content = input.value.trim();
                if (!content || !studentMaSV) return;

                const payload = {
                    maSV: studentMaSV,
                    nguoiGui: studentMaSV,
                    tenNguoiGui: studentHoTen,
                    vaiTroGui: 'SINH_VIEN',
                    noiDung: content
                };

                if (chatStompClient && chatStompClient.connected) {
                    chatStompClient.send("/app/chat.send", {}, JSON.stringify(payload));
                    appendStudentMessageBubble({
                        ...payload,
                        thoiGianFormatted: 'Vừa xong'
                    });
                    input.value = '';
                } else {
                    fetch('/api/chat/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    })
                    .then(res => res.json())
                    .then(saved => {
                        appendStudentMessageBubble(saved);
                        input.value = '';
                    });
                }
            };

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.innerText = text;
                return div.innerHTML;
            }
        })();
        /*]]>*/
        </script>
    </th:block>

    <!-- ========================================== -->
    <!-- 2. CHAT WIDGET DÀNH CHO BAN QUẢN SINH       -->
    <!-- ========================================== -->
    <th:block sec:authorize="hasAnyRole('QUAN_SINH', 'QUAN_TRI')">
        <!-- Nút Chat nổi của Quản sinh (ẩn nếu đang ở trang /quansinh/chat) -->
        <div id="managerChatFloatingBtn" class="position-fixed" style="bottom: 24px; right: 24px; z-index: 1045;">
            <button type="button" class="btn btn-primary rounded-pill shadow-lg d-flex align-items-center justify-content-center position-relative px-3 py-2 text-white fw-semibold"
                    style="height: 50px; font-size: 0.95rem; background: linear-gradient(135deg, #0d6efd, #0a58ca); border: none; box-shadow: 0 4px 15px rgba(13,110,253,0.35); transition: all 0.3s ease;"
                    id="toggleManagerChatBtn" onclick="toggleManagerChatBox()" title="Hỗ trợ & Tin nhắn Sinh viên">
                <i class="fas fa-comments fs-5 me-2"></i>
                <span class="d-none d-sm-inline">Tin nhắn SV</span>
                <span id="managerChatBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none badge-chat-pulse" 
                      style="font-size: 0.75rem; border: 2px solid #ffffff; z-index: 10;">
                    <span id="managerChatBadgeCount">0</span>
                </span>
            </button>
        </div>

        <!-- Cửa sổ Chat Popup của Quản sinh -->
        <div id="managerChatWindow" class="position-fixed card shadow-lg border-0 d-none flex-column"
             style="bottom: 84px; right: 24px; width: 380px; max-width: calc(100vw - 32px); height: 510px; max-height: calc(100vh - 110px); z-index: 1045; border-radius: 14px; overflow: hidden;">
            
            <!-- Header -->
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-2 px-3">
                <div class="d-flex align-items-center">
                    <button type="button" id="managerChatBackBtn" class="btn btn-sm btn-link text-white p-0 me-2 d-none" onclick="showManagerConversationList()" title="Quay lại danh sách">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="rounded-circle bg-white text-primary d-flex align-items-center justify-content-center me-2 fw-bold" style="width: 32px; height: 32px; font-size: 0.9rem;">
                        <i class="fas fa-headset"></i>
                    </div>
                    <div>
                        <h6 class="mb-0 fw-bold" style="font-size: 0.92rem;" id="managerChatTitle">Tin nhắn Sinh viên</h6>
                        <small class="text-white-50" style="font-size: 0.72rem;" id="managerChatSubtitle">Hỗ trợ trực tuyến</small>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <a href="/quansinh/chat" class="btn btn-sm btn-outline-light py-0 px-2 text-white" style="font-size: 0.75rem;" title="Mở trang đầy đủ">
                        <i class="fas fa-up-right-from-square me-1"></i>Toàn trang
                    </a>
                    <button type="button" class="btn-close btn-close-white" style="font-size: 0.75rem;" onclick="toggleManagerChatBox()" aria-label="Đóng"></button>
                </div>
            </div>

            <!-- View 1: Danh sách các cuộc trò chuyện của sinh viên -->
            <div id="managerConversationListView" class="flex-grow-1 overflow-auto d-flex flex-column bg-white">
                <div class="p-2 border-bottom bg-light">
                    <input type="text" id="managerSearchInput" class="form-control form-control-sm" placeholder="Tìm sinh viên...">
                </div>
                <div id="managerConversationListContainer" class="list-group list-group-flush flex-grow-1 overflow-auto">
                    <div class="text-center text-muted p-4 small" id="managerLoadingPlaceholder">
                        <div class="spinner-border spinner-border-sm text-primary mb-2"></div>
                        <div>Đang tải hội thoại...</div>
                    </div>
                </div>
            </div>

            <!-- View 2: Khung chat chi tiết với 1 sinh viên -->
            <div id="managerChatThreadView" class="flex-grow-1 d-none flex-column overflow-hidden bg-light">
                <div id="managerChatMessageLog" class="card-body p-3 overflow-auto flex-grow-1 d-flex flex-column gap-2" style="background-color: #f8f9fa;">
                </div>
                <div class="card-footer bg-white border-top p-2">
                    <form id="managerChatForm" class="d-flex gap-2 m-0" onsubmit="event.preventDefault(); sendManagerMessageFromWidget();">
                        <input type="text" id="managerMessageInput" class="form-control form-control-sm" placeholder="Nhập câu trả lời cho SV..." autocomplete="off">
                        <button type="submit" class="btn btn-primary btn-sm px-3 fw-bold">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
        /*<![CDATA[*/
        (function() {
            let isManagerChatOpen = false;
            let currentSelectedStudent = null;
            let managerStompClient = null;
            let allConversations = [];

            document.addEventListener("DOMContentLoaded", function () {
                // Nếu đang ở màn hình toàn trang /quansinh/chat thì ẩn nút nổi để tránh che giao diện
                if (window.location.pathname && window.location.pathname.startsWith('/quansinh/chat')) {
                    const btn = document.getElementById('managerChatFloatingBtn');
                    if (btn) btn.classList.add('d-none');
                }

                // 1. Kiểm tra số tin nhắn chưa đọc khi tải trang để hiện badge đỏ
                checkManagerUnreadMessages();

                // 2. Kết nối WebSocket lắng nghe tin nhắn mới từ sinh viên
                if (typeof SockJS !== 'undefined' && typeof Stomp !== 'undefined') {
                    const socket = new SockJS('/ws-dormitory');
                    managerStompClient = Stomp.over(socket);
                    managerStompClient.debug = null;

                    managerStompClient.connect({}, function () {
                        managerStompClient.subscribe('/topic/chat/quansinh', function (message) {
                            const msg = JSON.parse(message.body);
                            onStudentMessageReceivedForManager(msg);
                        });
                    });
                }

                // 3. Search hội thoại
                const searchInput = document.getElementById('managerSearchInput');
                if (searchInput) {
                    searchInput.addEventListener('input', function(e) {
                        const term = e.target.value.toLowerCase().trim();
                        filterManagerConversations(term);
                    });
                }
            });

            function checkManagerUnreadMessages() {
                fetch('/api/chat/unread-count?vaiTro=QUAN_SINH')
                    .then(res => res.json())
                    .then(count => {
                        updateManagerBadges(count);
                    })
                    .catch(() => {});
            }

            function updateManagerBadges(count) {
                const badge = document.getElementById('managerChatBadge');
                const badgeCount = document.getElementById('managerChatBadgeCount');
                const toggleBtn = document.getElementById('toggleManagerChatBtn');
                const sidebarBadge = document.getElementById('managerSidebarChatBadge');

                const countNum = parseInt(count) || 0;
                if (countNum > 0) {
                    const displayCount = countNum > 99 ? '99+' : countNum;
                    if (badge && badgeCount) {
                        badgeCount.innerText = displayCount;
                        badge.classList.remove('d-none');
                    }
                    if (toggleBtn) toggleBtn.classList.add('chat-btn-has-unread');
                    if (sidebarBadge) {
                        sidebarBadge.innerText = displayCount;
                        sidebarBadge.classList.remove('d-none');
                    }
                } else {
                    if (badge) badge.classList.add('d-none');
                    if (toggleBtn) toggleBtn.classList.remove('chat-btn-has-unread');
                    if (sidebarBadge) sidebarBadge.classList.add('d-none');
                }
            }

            window.toggleManagerChatBox = function() {
                const chatBox = document.getElementById('managerChatWindow');
                if (!chatBox) return;

                isManagerChatOpen = !isManagerChatOpen;
                if (isManagerChatOpen) {
                    chatBox.classList.remove('d-none');
                    chatBox.classList.add('d-flex');

                    // Mở màn danh sách hội thoại
                    showManagerConversationList();
                    loadManagerConversations();
                } else {
                    chatBox.classList.remove('d-flex');
                    chatBox.classList.add('d-none');
                }
            };

            function onStudentMessageReceivedForManager(msg) {
                // Tăng badge đỏ nếu không đang chat với đúng sinh viên đó
                if (!isManagerChatOpen || !currentSelectedStudent || currentSelectedStudent.maSV !== msg.maSV) {
                    const countEl = document.getElementById('managerChatBadgeCount');
                    let current = parseInt(countEl ? countEl.innerText : '0') || 0;
                    updateManagerBadges(current + 1);

                    // Nếu danh sách hội thoại đang mở, làm mới danh sách
                    if (isManagerChatOpen && !currentSelectedStudent) {
                        loadManagerConversations();
                    }
                } else {
                    // Đang mở đúng cửa sổ chat của sinh viên này
                    appendManagerMessageBubble(msg);
                    fetch('/api/chat/read?maSV=' + msg.maSV + '&vaiTro=QUAN_SINH', { method: 'POST' });
                }
            }

            function loadManagerConversations() {
                const container = document.getElementById('managerConversationListContainer');
                fetch('/api/chat/conversations')
                    .then(res => res.json())
                    .then(data => {
                        allConversations = data;
                        renderManagerConversationList(data);
                    })
                    .catch(() => {
                        if (container) container.innerHTML = '<div class="text-center text-danger p-3 small">Không thể tải hội thoại</div>';
                    });
            }

            function renderManagerConversationList(conversations) {
                const container = document.getElementById('managerConversationListContainer');
                if (!container) return;
                container.innerHTML = '';

                if (conversations.length === 0) {
                    container.innerHTML = '<div class="text-center text-muted p-4 small">Chưa có tin nhắn nào từ sinh viên.</div>';
                    return;
                }

                conversations.forEach(item => {
                    const unreadBadge = item.soTinChuaDoc > 0 
                        ? `<span class="badge rounded-pill bg-danger badge-chat-pulse ms-2" style="font-size: 0.7rem;">${item.soTinChuaDoc}</span>` 
                        : '';
                    const itemHtml = `
                        <button type="button" class="list-group-item list-group-item-action d-flex align-items-center py-2 px-3 border-0 border-bottom"
                                onclick="openStudentChatThread('${escapeJs(item.maSV)}', '${escapeJs(item.tenSinhVien)}', '${escapeJs(item.phong)}')">
                            <div class="rounded-circle bg-primary bg-opacity-10 text-primary d-flex align-items-center justify-content-center fw-bold me-2" style="width: 36px; height: 36px; flex-shrink: 0; font-size: 0.85rem;">
                                ${escapeHtml(item.tenSinhVien ? item.tenSinhVien.charAt(0).toUpperCase() : 'S')}
                            </div>
                            <div class="flex-grow-1 text-truncate text-start" style="min-width: 0;">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="fw-bold small text-dark text-truncate">${escapeHtml(item.tenSinhVien)}</div>
                                    <div class="text-muted" style="font-size: 0.65rem;">${item.thoiGianCuoi || ''}</div>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mt-1">
                                    <div class="text-muted text-truncate" style="font-size: 0.75rem;">${escapeHtml(item.tinNhanCuoi || '...')}</div>
                                    <div class="d-flex align-items-center">
                                        <span class="badge bg-light text-secondary border me-1" style="font-size: 0.65rem;">${escapeHtml(item.phong)}</span>
                                        ${unreadBadge}
                                    </div>
                                </div>
                            </div>
                        </button>
                    `;
                    container.insertAdjacentHTML('beforeend', itemHtml);
                });
            }

            function filterManagerConversations(term) {
                if (!term) {
                    renderManagerConversationList(allConversations);
                    return;
                }
                const filtered = allConversations.filter(c => 
                    (c.tenSinhVien && c.tenSinhVien.toLowerCase().includes(term)) ||
                    (c.maSV && c.maSV.toLowerCase().includes(term)) ||
                    (c.phong && c.phong.toLowerCase().includes(term))
                );
                renderManagerConversationList(filtered);
            }

            window.openStudentChatThread = function(maSV, tenSV, phong) {
                currentSelectedStudent = { maSV, tenSV, phong };
                document.getElementById('managerConversationListView').classList.add('d-none');
                document.getElementById('managerChatThreadView').classList.remove('d-none');
                document.getElementById('managerChatThreadView').classList.add('d-flex');
                document.getElementById('managerChatBackBtn').classList.remove('d-none');

                document.getElementById('managerChatTitle').innerText = tenSV;
                document.getElementById('managerChatSubtitle').innerText = `${maSV} - ${phong}`;

                // Tải lịch sử chat
                const log = document.getElementById('managerChatMessageLog');
                log.innerHTML = '<div class="text-center text-muted my-auto small"><div class="spinner-border spinner-border-sm text-primary mb-1"></div><div>Đang tải...</div></div>';

                fetch('/api/chat/history?maSV=' + maSV)
                    .then(res => res.json())
                    .then(data => {
                        log.innerHTML = '';
                        if (data.length === 0) {
                            log.innerHTML = '<div class="text-center text-muted my-auto small">Bắt đầu cuộc trò chuyện với sinh viên.</div>';
                        } else {
                            data.forEach(appendManagerMessageBubble);
                            scrollManagerLogToBottom();
                        }
                    });

                // Đánh dấu đã đọc
                fetch('/api/chat/read?maSV=' + maSV + '&vaiTro=QUAN_SINH', { method: 'POST' })
                    .then(() => checkManagerUnreadMessages());

                setTimeout(() => {
                    const input = document.getElementById('managerMessageInput');
                    if (input) input.focus();
                }, 100);
            };

            window.showManagerConversationList = function() {
                currentSelectedStudent = null;
                document.getElementById('managerChatThreadView').classList.remove('d-flex');
                document.getElementById('managerChatThreadView').classList.add('d-none');
                document.getElementById('managerConversationListView').classList.remove('d-none');
                document.getElementById('managerChatBackBtn').classList.add('d-none');

                document.getElementById('managerChatTitle').innerText = 'Tin nhắn Sinh viên';
                document.getElementById('managerChatSubtitle').innerText = 'Hỗ trợ trực tuyến';

                loadManagerConversations();
                checkManagerUnreadMessages();
            };

            function appendManagerMessageBubble(msg) {
                const log = document.getElementById('managerChatMessageLog');
                if (!log) return;

                const isMe = msg.vaiTroGui === 'QUAN_SINH';

                const bubbleHtml = `
                    <div class="d-flex flex-column ${isMe ? 'align-items-end' : 'align-items-start'} mb-1">
                        <div class="d-flex align-items-center mb-1">
                            <span class="small text-secondary me-1" style="font-size: 0.68rem;">${isMe ? 'Ban Quản Sinh' : (msg.tenNguoiGui || 'Sinh viên')}</span>
                            <span class="text-muted" style="font-size: 0.65rem;">${msg.thoiGianFormatted || ''}</span>
                        </div>
                        <div class="p-2 px-3 rounded-3 shadow-sm ${isMe ? 'bg-primary text-white' : 'bg-white text-dark border'}" style="max-width: 82%; font-size: 0.88rem; word-break: break-word;">
                            ${escapeHtml(msg.noiDung)}
                        </div>
                    </div>
                `;

                log.insertAdjacentHTML('beforeend', bubbleHtml);
                scrollManagerLogToBottom();
            }

            function scrollManagerLogToBottom() {
                const log = document.getElementById('managerChatMessageLog');
                if (log) log.scrollTop = log.scrollHeight;
            }

            window.sendManagerMessageFromWidget = function() {
                const input = document.getElementById('managerMessageInput');
                const content = input.value.trim();
                if (!content || !currentSelectedStudent) return;

                const payload = {
                    maSV: currentSelectedStudent.maSV,
                    nguoiGui: 'QUAN_SINH',
                    tenNguoiGui: 'Ban Quản Sinh KTX',
                    vaiTroGui: 'QUAN_SINH',
                    noiDung: content
                };

                if (managerStompClient && managerStompClient.connected) {
                    managerStompClient.send("/app/chat.send", {}, JSON.stringify(payload));
                    appendManagerMessageBubble({
                        ...payload,
                        thoiGianFormatted: 'Vừa xong'
                    });
                    input.value = '';
                } else {
                    fetch('/api/chat/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    })
                    .then(res => res.json())
                    .then(saved => {
                        appendManagerMessageBubble(saved);
                        input.value = '';
                    });
                }
            };

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.innerText = text;
                return div.innerHTML;
            }

            function escapeJs(text) {
                if (!text) return '';
                return text.replace(/'/g, "\\'");
            }
        })();
        /*]]>*/
        </script>
    </th:block>

</div>
</body>
</html>
