<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<th:block th:fragment="header">
<nav class="navbar navbar-expand-lg navbar-light sticky-top shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-dark d-flex align-items-center" href="/">
            <i class="fas fa-city text-primary me-2"></i><span>KTX TƯ NHÂN</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <!-- Additional nav items can go here -->
            </ul>
            <div class="d-flex align-items-center">
                <!-- Nút Chuông Thông Báo -->
                <div class="dropdown me-4" th:if="${thongBaoInfo != null}">
                    <a class="text-secondary position-relative dropdown-toggle-hidden" href="#" role="button" id="bellDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-bell fs-5"></i>
                        <span id="bellBadge" th:if="${thongBaoInfo.totalCount > 0}" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.65em;">
                            <span id="bellCount" th:text="${thongBaoInfo.totalCount}">0</span>
                        </span>
                        <span id="bellBadgeEmpty" th:if="${thongBaoInfo.totalCount == 0}" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 0.65em;">
                            <span id="bellCountEmpty">0</span>
                        </span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="bellDropdown" style="width: 330px; max-height: 420px; overflow-y: auto;">
                        <li><h6 class="dropdown-header fw-bold text-dark border-bottom pb-2">Việc cần xử lý</h6></li>
                        <th:block th:if="${#lists.isEmpty(thongBaoInfo.todos)}">
                            <li><span class="dropdown-item text-muted small py-3 text-center">Tuyệt vời! Không có việc nào tồn đọng.</span></li>
                        </th:block>
                        <th:block th:each="todo : ${thongBaoInfo.todos}">
                            <li>
                                <a class="dropdown-item py-2 d-flex align-items-center" th:href="@{${todo.link}}">
                                    <div class="me-3 fs-5"><i th:class="${todo.iconClass}"></i></div>
                                    <div class="text-wrap small text-dark fw-bold" th:text="${todo.title}">Title</div>
                                </a>
                            </li>
                        </th:block>
                        
                        <li><h6 class="dropdown-header fw-bold text-dark border-bottom pb-2 mt-2">Cập nhật mới</h6></li>
                        <ul id="realtimeNotificationList" class="list-unstyled mb-0">
                            <th:block th:each="update : ${thongBaoInfo.updates}">
                                <li>
                                    <a class="dropdown-item py-2" th:href="@{/thong-bao/doc/{id}(id=${update.maThongBao})}" th:classappend="${!update.daDoc} ? 'bg-light' : ''">
                                        <div class="d-flex justify-content-between align-items-start">
                                            <div class="text-wrap small" th:classappend="${!update.daDoc} ? 'fw-bold text-dark' : 'text-secondary'" th:text="${update.tieuDe}">Update</div>
                                            <span th:if="${!update.daDoc}" class="badge bg-danger ms-2" style="font-size: 0.6rem;">Mới</span>
                                        </div>
                                        <div th:if="${update.noiDung != null and update.noiDung != ''}" class="text-wrap text-muted" style="font-size: 0.8rem;" th:text="${update.noiDung}">Detail</div>
                                        <div class="text-muted mt-1" style="font-size: 0.72rem;" th:text="${#temporals.format(update.ngayTao, 'dd/MM/yyyy HH:mm')}">Time</div>
                                    </a>
                                </li>
                            </th:block>
                        </ul>
                    </ul>
                </div>
                <span class="me-3" th:text="${#authentication != null and #authentication.principal instanceof T(vn.iotstar.dormitory.security.CustomUserDetails) ? #authentication.principal.hoTen : (#authentication != null ? #authentication.name : 'Người dùng')}">Người dùng</span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-outline-danger btn-sm" type="submit">
                        <i class="fas fa-sign-out-alt me-1"></i>Đăng xuất
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- Toast Container cho Realtime Push Notification -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1090;">
    <div id="realtimeToast" class="toast align-items-center text-white bg-primary border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <div class="fw-bold fs-6 mb-1"><i class="fas fa-bell me-2"></i><span id="toastTitle">Thông báo mới</span></div>
                <div id="toastMessage" class="small">Nội dung thông báo</div>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<!-- Live Chat Widget cho Sinh viên -->
<div th:replace="~{fragments/chat_widget :: chat_widget}"></div>

<!-- WebSocket STOMP Client Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script th:inline="javascript">
/*<![CDATA[*/
document.addEventListener("DOMContentLoaded", function () {
    const currentUsername = /*[[${#authentication != null ? #authentication.name : ''}]]*/ '';
    const currentRole = /*[[${#authentication != null and #authentication.authorities != null and !#authentication.authorities.isEmpty() ? #authentication.authorities[0].authority : ''}]]*/ '';

    if (currentUsername && currentUsername !== 'anonymousUser') {
        const socket = new SockJS('/ws-dormitory');
        const stompClient = Stomp.over(socket);
        stompClient.debug = null; // Tắt log debug verbose

        stompClient.connect({}, function () {
            // 1. Subscribe kênh cá nhân của user
            stompClient.subscribe('/topic/thong-bao/' + currentUsername, function (message) {
                const notif = JSON.parse(message.body);
                showPushNotification(notif);
            });

            // 2. Nếu là Quản Sinh, subscribe kênh chung của ban quản sinh
            if (currentRole === 'ROLE_QUAN_SINH') {
                stompClient.subscribe('/topic/thong-bao/ROLE_QUAN_SINH', function (message) {
                    const notif = JSON.parse(message.body);
                    showPushNotification(notif);
                });
            }
        });

        function showPushNotification(notif) {
            // Cập nhật số badge
            const badgeEl = document.getElementById('bellBadge');
            const countEl = document.getElementById('bellCount');
            const emptyBadge = document.getElementById('bellBadgeEmpty');
            const emptyCount = document.getElementById('bellCountEmpty');

            if (badgeEl && countEl) {
                let count = parseInt(countEl.innerText) || 0;
                countEl.innerText = count + 1;
            } else if (emptyBadge && emptyCount) {
                emptyBadge.classList.remove('d-none');
                let count = parseInt(emptyCount.innerText) || 0;
                emptyCount.innerText = count + 1;
            }

            // Thêm item vào danh sách thông báo
            const listEl = document.getElementById('realtimeNotificationList');
            if (listEl) {
                const itemHtml = `
                    <li>
                        <a class="dropdown-item py-2 bg-light border-start border-3 border-primary" href="${notif.link || '/'}">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="text-wrap small fw-bold text-dark">${notif.tieuDe}</div>
                                <span class="badge bg-danger ms-2" style="font-size: 0.6rem;">Vừa xong</span>
                            </div>
                            <div class="text-wrap text-muted" style="font-size: 0.8rem;">${notif.noiDung || ''}</div>
                            <div class="text-muted mt-1" style="font-size: 0.72rem;">Vừa nhận</div>
                        </a>
                    </li>
                `;
                listEl.insertAdjacentHTML('afterbegin', itemHtml);
            }

            // Hiển thị Toast nổi
            const toastEl = document.getElementById('realtimeToast');
            const toastTitle = document.getElementById('toastTitle');
            const toastMessage = document.getElementById('toastMessage');

            if (toastEl && window.bootstrap) {
                if (toastTitle) toastTitle.innerText = notif.tieuDe;
                if (toastMessage) toastMessage.innerText = notif.noiDung || '';
                const toast = new bootstrap.Toast(toastEl, { delay: 6000 });
                toast.show();
            }
        }
    }
});
/*]]>*/
</script>
</th:block>
</html>
